name: Normalize HTML XML terminology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-html-xml-terminology.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'chore: apply Vietnamese terminology normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize prose terminology
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('10_frontend/html/html_01_beginner_to_senior_detailed.md'),
              Path('10_frontend/html/html_02_master_implementation_detailed.md'),
              Path('10_frontend/xml/xml_01_beginner_detailed.md'),
              Path('10_frontend/xml/xml_02_intermediate_detailed.md'),
              Path('10_frontend/xml/xml_03_senior_detailed.md'),
              Path('10_frontend/xml/xml_04_master_supplement_detailed.md'),
          ]

          html_glossary = '''## Quy ước thuật ngữ trong tài liệu

          Tài liệu ưu tiên giải thích bằng tiếng Việt tự nhiên và giữ thuật ngữ tiếng Anh khi nó là tên chuẩn cần đối chiếu. Những khái niệm xuất hiện nhiều được hiểu thống nhất như sau: **phân tích cú pháp (parsing)** là quá trình trình duyệt hoặc bộ phân tích đọc mã nguồn để tạo cấu trúc dữ liệu; **ngữ nghĩa (semantics)** là ý nghĩa mà phần tử truyền cho trình duyệt và công nghệ hỗ trợ; **cây trợ năng (accessibility tree)** là cấu trúc mà công nghệ hỗ trợ sử dụng để hiểu giao diện; **kiểm tra ràng buộc của biểu mẫu (constraint validation)** là cơ chế kiểm tra hợp lệ gốc của HTML; **mô hình nội dung (content model)** quy định phần tử nào được phép chứa phần tử nào; **trạng thái hiện thời (live state)** là giá trị hiện tại trên đối tượng DOM, có thể khác giá trị ban đầu trong mã HTML; **lớp trên cùng (top layer)** là lớp đặc biệt do trình duyệt quản lý cho các thành phần như dialog và popover. Các tên chuẩn như DOM, ARIA, CORS, CSP, Shadow DOM, Web Components, `iframe`, tag, attribute hoặc API cụ thể được giữ nguyên khi dịch sẽ làm mất nghĩa hoặc gây khó tra cứu.

          ''')

          xml_glossary = '''## Quy ước thuật ngữ trong tài liệu

          Tài liệu ưu tiên tiếng Việt tự nhiên nhưng luôn giữ thuật ngữ gốc ở những khái niệm cần tra cứu. Các thuật ngữ cốt lõi được dùng thống nhất như sau: **phần tử (element)** là đơn vị cấu trúc chính của XML; **thuộc tính (attribute)** là thông tin gắn trên phần tử; **không gian tên (namespace)** phân biệt các bộ từ vựng XML; **lược đồ (schema)** mô tả cấu trúc và kiểu dữ liệu hợp lệ; **phân tích cú pháp (parsing)** biến byte/text XML thành cây hoặc chuỗi sự kiện; **đúng cú pháp XML (well-formed)** nghĩa là thỏa các quy tắc cú pháp lõi; **kiểm tra tính hợp lệ (validation)** kiểm tra tài liệu theo DTD/XSD hoặc quy tắc khác; **xử lý theo luồng (streaming)** đọc dữ liệu tuần tự mà không giữ toàn bộ cây trong bộ nhớ; **tuần tự hóa (serialization)** biến cấu trúc XML trong bộ nhớ trở lại dạng text/byte; **chuẩn hóa chính tắc (canonicalization/C14N)** tạo biểu diễn ổn định phục vụ so sánh hoặc chữ ký số. Các tên chuẩn như XML, DTD, XSD, XPath, XSLT, XQuery, DOM, SAX, StAX, SOAP, WSDL, QName, PSVI và tên API cụ thể được giữ nguyên.

          ''')

          common = [
              ('assistive technology', 'công nghệ hỗ trợ'),
              ('accessibility tree', 'cây trợ năng'),
              ('accessible name', 'tên truy cập được'),
              ('accessible description', 'mô tả trợ năng'),
              ('constraint validation', 'kiểm tra ràng buộc'),
              ('content model', 'mô hình nội dung'),
              ('error recovery', 'phục hồi lỗi'),
              ('live state', 'trạng thái hiện thời'),
              ('resource loading', 'tải tài nguyên'),
              ('resource hints', 'gợi ý tải tài nguyên'),
              ('resource hint', 'gợi ý tải tài nguyên'),
              ('render-blocking', 'chặn kết xuất (render-blocking)'),
              ('parser-blocking', 'chặn bộ phân tích cú pháp (parser-blocking)'),
              ('cross-origin', 'khác nguồn (cross-origin)'),
              ('same-origin', 'cùng nguồn (same-origin)'),
              ('progressive enhancement', 'tăng cường dần (progressive enhancement)'),
              ('default state', 'trạng thái mặc định'),
              ('current state', 'trạng thái hiện tại'),
              ('form owner', 'biểu mẫu chủ quản (form owner)'),
              ('successful controls', 'các điều khiển được đưa vào dữ liệu gửi đi (successful controls)'),
              ('submitter', 'điều khiển gửi biểu mẫu (submitter)'),
              ('top layer', 'lớp trên cùng (top layer)'),
              ('custom element', 'phần tử tùy biến (custom element)'),
              ('custom elements', 'các phần tử tùy biến (custom elements)'),
              ('boolean attribute', 'thuộc tính boolean'),
              ('global attribute', 'thuộc tính toàn cục'),
              ('void element', 'phần tử rỗng đặc biệt (void element)'),
              ('content attribute', 'thuộc tính nội dung (content attribute)'),
              ('DOM property', 'thuộc tính DOM (DOM property)'),
              ('screen reader', 'trình đọc màn hình (screen reader)'),
              ('keyboard', 'bàn phím'),
              ('metadata', 'siêu dữ liệu'),
              ('performance', 'hiệu năng'),
              ('security', 'bảo mật'),
              ('validation', 'kiểm tra tính hợp lệ'),
              ('fallback', 'phương án dự phòng'),
              ('focus', 'tiêu điểm (focus)'),
              ('interaction', 'tương tác'),
              ('rendering', 'kết xuất'),
              ('render', 'kết xuất'),
              ('browser', 'trình duyệt'),
              ('Browser', 'Trình duyệt'),
          ]

          html_terms = [
              ('semantic HTML', 'HTML ngữ nghĩa (semantic HTML)'),
              ('semantic element', 'phần tử mang ngữ nghĩa (semantic element)'),
              ('semantic elements', 'các phần tử mang ngữ nghĩa (semantic elements)'),
              ('semantics', 'ngữ nghĩa'),
              ('semantic', 'mang ngữ nghĩa'),
              ('accessibility', 'khả năng tiếp cận (accessibility)'),
              ('HTML parser', 'bộ phân tích cú pháp HTML (HTML parser)'),
              ('parser', 'bộ phân tích cú pháp'),
              ('parsing', 'phân tích cú pháp'),
              ('tree construction', 'quá trình dựng cây DOM (tree construction)'),
              ('tokenizer', 'bộ tách token (tokenizer)'),
              ('loading', 'tải'),
              ('legacy', 'hệ thống cũ (legacy)'),
              ('deprecated', 'không còn khuyến nghị (deprecated)'),
              ('obsolete', 'lỗi thời (obsolete)'),
          ]

          xml_terms = [
              ('enterprise integration', 'tích hợp doanh nghiệp (enterprise integration)'),
              ('schema evolution', 'tiến hóa lược đồ (schema evolution)'),
              ('digital signature', 'chữ ký số (digital signature)'),
              ('signature wrapping', 'tấn công bọc chữ ký (signature wrapping)'),
              ('attack surface', 'bề mặt tấn công (attack surface)'),
              ('threat model', 'mô hình đe dọa (threat model)'),
              ('external resource', 'tài nguyên bên ngoài'),
              ('external resources', 'các tài nguyên bên ngoài'),
              ('external entity', 'thực thể ngoài (external entity)'),
              ('external entities', 'các thực thể ngoài (external entities)'),
              ('mixed content', 'nội dung hỗn hợp (mixed content)'),
              ('data-centric', 'hướng dữ liệu (data-centric)'),
              ('document-centric', 'hướng tài liệu (document-centric)'),
              ('root element', 'phần tử gốc (root element)'),
              ('expanded name', 'tên mở rộng (expanded name)'),
              ('default namespace', 'không gian tên mặc định (default namespace)'),
              ('namespace URI', 'URI của không gian tên (namespace URI)'),
              ('namespace', 'không gian tên (namespace)'),
              ('schema', 'lược đồ (schema)'),
              ('element', 'phần tử (element)'),
              ('attribute', 'thuộc tính (attribute)'),
              ('prefix', 'tiền tố (prefix)'),
              ('entity', 'thực thể (entity)'),
              ('well-formed', 'đúng cú pháp XML (well-formed)'),
              ('serialization', 'tuần tự hóa (serialization)'),
              ('canonicalization', 'chuẩn hóa chính tắc (canonicalization)'),
              ('streaming', 'xử lý theo luồng (streaming)'),
              ('parser', 'bộ phân tích cú pháp'),
              ('parsing', 'phân tích cú pháp'),
              ('query', 'truy vấn'),
              ('transformation', 'chuyển đổi'),
              ('mapping', 'ánh xạ'),
              ('binding', 'ánh xạ/liên kết (binding)'),
              ('resolver', 'bộ phân giải (resolver)'),
              ('wildcard', 'ký tự đại diện (wildcard)'),
              ('extension point', 'điểm mở rộng (extension point)'),
              ('identity constraints', 'ràng buộc định danh (identity constraints)'),
              ('type system', 'hệ kiểu (type system)'),
              ('interoperability', 'khả năng liên vận (interoperability)'),
              ('compatibility', 'khả năng tương thích'),
              ('hardening', 'gia cố bảo mật (hardening)'),
              ('pipeline', 'chuỗi xử lý (pipeline)'),
          ]

          def replace_segment(segment, replacements):
              # Longer phrases first. Avoid rewriting inside words.
              for src, dst in sorted(replacements, key=lambda x: len(x[0]), reverse=True):
                  pattern = r'(?<![A-Za-z0-9_-])' + re.escape(src) + r'(?![A-Za-z0-9_-])'
                  segment = re.sub(pattern, dst, segment)
              return segment

          def transform(text, replacements):
              out = []
              fenced = False
              for line in text.splitlines(keepends=True):
                  if line.lstrip().startswith('```'):
                      fenced = not fenced
                      out.append(line)
                      continue
                  if fenced:
                      out.append(line)
                      continue
                  # Preserve inline code spans exactly.
                  parts = re.split(r'(`[^`]*`)', line)
                  for i in range(0, len(parts), 2):
                      parts[i] = replace_segment(parts[i], replacements)
                  out.append(''.join(parts))
              return ''.join(out)

          for path in files:
              text = path.read_text(encoding='utf-8')
              is_html = '/html/' in path.as_posix()
              replacements = common + (html_terms if is_html else xml_terms)
              text = transform(text, replacements)
              glossary = html_glossary if is_html else xml_glossary
              if '## Quy ước thuật ngữ trong tài liệu' not in text:
                  marker = '\n---\n'
                  idx = text.find(marker)
                  if idx != -1:
                      text = text[:idx] + '\n\n' + glossary + text[idx:]
                  else:
                      text = glossary + text
              path.write_text(text, encoding='utf-8')

          # Remove this temporary workflow from the resulting content commit.
          Path('.github/workflows/normalize-html-xml-terminology.yml').unlink()

      - name: Commit canonical terminology update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 10_frontend/html 10_frontend/xml .github/workflows/normalize-html-xml-terminology.yml
          git commit -m "docs(html-xml): normalize Vietnamese technical terminology"
          git push origin main
