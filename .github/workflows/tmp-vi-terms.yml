name: Temporary Vietnamese terminology normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-vi-terms.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize technical terminology
        run: python .github/tmp-vi-terms/apply.py
      - name: Commit canonical note updates and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp-vi-terms
          rm -f .github/workflows/tmp-vi-terms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize Vietnamese technical terminology in CSS SCSS Tailwind notes"
          git pull --rebase origin main
          git push origin HEAD:main
