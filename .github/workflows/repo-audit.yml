name: Repository audit

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'automation/repo_audit.py'
      - 'automation/test_repo_audit.py'
      - '.github/workflows/repo-audit.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'automation/repo_audit.py'
      - 'automation/test_repo_audit.py'
      - '.github/workflows/repo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run auditor unit tests
        run: python -m unittest automation/test_repo_audit.py

      - name: Collect changed canonical Markdown files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR \
            '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}' \
            -- '*.md' \
            | grep -Ev '(^|/)(raw|raw_md|workflow-output)/' \
            > /tmp/changed-markdown.txt || true
          echo 'Changed canonical Markdown files:'
          cat /tmp/changed-markdown.txt

      - name: Audit changed docs strictly
        if: github.event_name == 'pull_request'
        run: |
          python automation/repo_audit.py \
            --root . \
            --files-from /tmp/changed-markdown.txt \
            --strict-links \
            --github-summary

      - name: Collect canonical Markdown baseline
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git ls-files '*.md' \
            | grep -Ev '(^|/)(raw|raw_md|workflow-output)/' \
            > /tmp/canonical-markdown.txt || true
          echo "Canonical Markdown files: $(wc -l < /tmp/canonical-markdown.txt)"

      - name: Audit full canonical repository in report mode
        if: github.event_name != 'pull_request'
        run: |
          python automation/repo_audit.py \
            --root . \
            --files-from /tmp/canonical-markdown.txt \
            --github-summary
