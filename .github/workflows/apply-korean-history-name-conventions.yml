name: Apply Korean history naming convention

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_korean_history_name_conventions.py'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip naming]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply multilingual naming convention
        run: python .github/scripts/apply_korean_history_name_conventions.py
      - name: Commit documentation updates
        run: |
          if git diff --quiet -- korean_history; then
            echo 'No documentation changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add korean_history
          git commit -m 'Standardize Korean history names in Vietnamese Korean English [skip naming]'
          git push origin HEAD:main
