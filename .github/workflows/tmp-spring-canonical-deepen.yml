name: Temporary Spring canonical deepening

on:
  push:
    paths:
      - '.github/workflows/tmp-spring-canonical-deepen.yml'

permissions:
  contents: write

jobs:
  deepen-spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply Spring batches
        run: python .github/tmp_spring_canonical_deepen.py

      - name: Validate and remove temporary helpers
        shell: bash
        run: |
          test -f 10_backend/spring_java/spring_part1_beginner_rewritten_detailed.md
          test -f 10_backend/spring_java/spring_part2_intermediate_rewritten_detailed.md
          test -f 10_backend/spring_java/spring_part3_senior_rewritten_detailed.md
          test -f 10_backend/spring_java/spring_part4_master_supplement_rewritten_detailed.md
          test "$(find 10_backend/spring_java -maxdepth 1 -name '*.md' | wc -l)" -eq 4
          ! find 10_backend/spring_java -maxdepth 1 -type f \( -name '*_updated*' -o -name '*_version_updated*' \) | grep -q .
          rm -f .github/tmp_spring_canonical_deepen.py .github/workflows/tmp-spring-canonical-deepen.yml
          git add -A .github
          git commit -m 'Remove temporary Spring deepening helpers'

      - name: Rebase on latest main and push all batches
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done
          echo 'Failed to publish Spring batches after retries' >&2
          exit 1
