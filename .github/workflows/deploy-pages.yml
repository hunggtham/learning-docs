name: Deploy Study Shelf

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: study-shelf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Normalize Vietnamese terminology once
        if: "${{ github.event.head_commit.message == 'chore: run one-time terminology normalization' }}"
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('10_frontend/html/html_01_beginner_to_senior_detailed.md'),
              Path('10_frontend/html/html_02_master_implementation_detailed.md'),
              Path('10_frontend/xml/xml_01_beginner_detailed.md'),
              Path('10_frontend/xml/xml_02_intermediate_detailed.md'),
              Path('10_frontend/xml/xml_03_senior_detailed.md'),
              Path('10_frontend/xml/xml_04_master_supplement_detailed.md'),
          ]

          html_glossary = """## Quy ước thuật ngữ trong tài liệu

          Tài liệu ưu tiên giải thích bằng tiếng Việt tự nhiên và giữ thuật ngữ tiếng Anh khi đó là tên chuẩn cần đối chiếu. Một số khái niệm được dùng thống nhất như sau: **phân tích cú pháp (parsing)** là quá trình trình duyệt hoặc bộ phân tích đọc mã nguồn để tạo cấu trúc dữ liệu; **ngữ nghĩa (semantics)** là ý nghĩa mà phần tử truyền cho trình duyệt và công nghệ hỗ trợ; **cây trợ năng (accessibility tree)** là cấu trúc mà công nghệ hỗ trợ sử dụng để hiểu giao diện; **kiểm tra ràng buộc của biểu mẫu (constraint validation)** là cơ chế kiểm tra hợp lệ gốc của HTML; **mô hình nội dung (content model)** quy định phần tử nào được phép chứa phần tử nào; **trạng thái hiện thời (live state)** là giá trị hiện tại trên đối tượng DOM, có thể khác giá trị ban đầu trong mã HTML; **lớp trên cùng (top layer)** là lớp đặc biệt do trình duyệt quản lý cho `dialog`, popover và một số giao diện nổi. Các tên chuẩn như DOM, ARIA, CORS, CSP, Shadow DOM, Web Components, `iframe`, tag, attribute hoặc tên API cụ thể được giữ nguyên khi dịch sẽ làm mất nghĩa hoặc gây khó tra cứu.

          """

          xml_glossary = """## Quy ước thuật ngữ trong tài liệu

          Tài liệu ưu tiên tiếng Việt tự nhiên nhưng giữ thuật ngữ gốc ở những khái niệm cần tra cứu. Các thuật ngữ cốt lõi được dùng thống nhất như sau: **phần tử (element)** là đơn vị cấu trúc chính của XML; **thuộc tính (attribute)** là thông tin gắn trên phần tử; **không gian tên (namespace)** phân biệt các bộ từ vựng XML; **lược đồ (schema)** mô tả cấu trúc và kiểu dữ liệu hợp lệ; **phân tích cú pháp (parsing)** biến byte/text XML thành cây hoặc chuỗi sự kiện; **đúng cú pháp XML (well-formed)** nghĩa là thỏa các quy tắc cú pháp lõi; **kiểm tra tính hợp lệ (validation)** kiểm tra tài liệu theo DTD/XSD hoặc quy tắc khác; **xử lý theo luồng (streaming)** đọc dữ liệu tuần tự mà không giữ toàn bộ cây trong bộ nhớ; **tuần tự hóa (serialization)** biến cấu trúc XML trong bộ nhớ trở lại dạng text/byte; **chuẩn hóa chính tắc (canonicalization/C14N)** tạo biểu diễn ổn định phục vụ so sánh hoặc chữ ký số. Các tên chuẩn như XML, DTD, XSD, XPath, XSLT, XQuery, DOM, SAX, StAX, SOAP, WSDL, QName, PSVI và tên API cụ thể được giữ nguyên.

          """

          common = [
