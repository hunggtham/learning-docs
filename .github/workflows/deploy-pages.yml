name: Deploy Study Shelf

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: study-shelf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Audit publication manifest
        working-directory: learning-library
        run: npm run audit:library

      - name: Build Study Shelf
        run: node learning-library/scripts/build-library.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-library/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
