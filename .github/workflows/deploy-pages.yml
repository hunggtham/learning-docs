name: Build and deploy Study Shelf

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Audit publication manifest
        working-directory: learning-library
        run: npm run audit:library
      - name: Build document index and site artifact
        run: node learning-library/scripts/build-library.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: learning-library/site
      - id: deployment
        uses: actions/deploy-pages@v4
