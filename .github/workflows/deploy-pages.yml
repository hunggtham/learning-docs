          def replace_segment(segment, replacements):
              for src, dst in sorted(replacements, key=lambda x: len(x[0]), reverse=True):
                  pattern = r'(?<![A-Za-z0-9_-])' + re.escape(src) + r'(?![A-Za-z0-9_-])'
                  segment = re.sub(pattern, dst, segment)
              return segment

          def transform(text, replacements):
              out = []
              fenced = False
              for line in text.splitlines(keepends=True):
                  if line.lstrip().startswith('```'):
                      fenced = not fenced
                      out.append(line)
                      continue
                  if fenced:
                      out.append(line)
                      continue
                  parts = re.split(r'(`[^`]*`)', line)
                  for i in range(0, len(parts), 2):
                      parts[i] = replace_segment(parts[i], replacements)
                  out.append(''.join(parts))
              return ''.join(out)

          for path in files:
              text = path.read_text(encoding='utf-8')
              is_html = '/html/' in path.as_posix()
              replacements = common + (html_terms if is_html else xml_terms)
              text = transform(text, replacements)
              glossary = html_glossary if is_html else xml_glossary
              if '## Quy ước thuật ngữ trong tài liệu' not in text:
                  marker = '\n---\n'
                  idx = text.find(marker)
                  if idx != -1:
                      text = text[:idx] + '\n\n' + glossary + text[idx:]
                  else:
                      text = glossary + text
              path.write_text(text, encoding='utf-8')
          PY

          git checkout HEAD^ -- .github/workflows/deploy-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 10_frontend/html 10_frontend/xml .github/workflows/deploy-pages.yml
          if git diff --cached --quiet; then
            echo "No terminology changes detected"
            exit 0
          fi
          git commit -m "docs(html-xml): normalize Vietnamese technical terminology"
          git pull --rebase origin main
          git push origin main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Audit publication manifest
        working-directory: learning-library
        run: npm run audit:library

      - name: Build Study Shelf
        run: node learning-library/scripts/build-library.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-library/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
