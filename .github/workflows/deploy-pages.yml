              ('HTML parser', 'bộ phân tích cú pháp HTML (HTML parser)'),
              ('tree construction', 'quá trình dựng cây DOM (tree construction)'),
              ('tokenizer', 'bộ tách token (tokenizer)'),
              ('parsing', 'phân tích cú pháp (parsing)'),
