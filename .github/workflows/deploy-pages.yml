          def replace_outside_code(text, replacements):
              replacements = sorted(replacements, key=lambda x: len(x[0]), reverse=True)
              out = []
              fenced = False
              for line in text.splitlines(keepends=True):
                  if line.lstrip().startswith('```'):
                      fenced = not fenced
                      out.append(line)
                      continue
                  if fenced:
                      out.append(line)
                      continue
                  parts = re.split(r'(`[^`]*`)', line)
                  for i in range(0, len(parts), 2):
                      segment = parts[i]
                      for old, new in replacements:
                          pattern = r'(?<![A-Za-z0-9_-])' + re.escape(old) + r'(?![A-Za-z0-9_-])'
                          segment = re.sub(pattern, new, segment)
                      parts[i] = segment
                  out.append(''.join(parts))
              return ''.join(out)

          def set_glossary(text, glossary):
              pattern = r'## Quy ước thuật ngữ trong tài liệu\n.*?\n\n---\n'
              return re.sub(pattern, glossary.rstrip() + '\n\n---\n', text, count=1, flags=re.S)

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              text = replace_outside_code(text, html_replacements)
              text = set_glossary(text, html_glossary)
              text = text.replace('# HTML — Master Implementation', '# HTML — Triển khai mức Master (Master Implementation)')
