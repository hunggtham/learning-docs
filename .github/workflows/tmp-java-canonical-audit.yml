name: Temporary Java canonical audit

on:
  push:
    paths:
      - '.github/workflows/tmp-java-canonical-audit.yml'

permissions:
  contents: write

jobs:
  audit-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update and audit canonical Java notes
        run: python .github/tmp_update_java.py

      - name: Commit canonical notes and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/tmp_update_java.py .github/workflows/tmp-java-canonical-audit.yml
          git add -A
          git diff --cached --stat
          git commit -m 'Audit and deepen canonical Java knowledge library'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
