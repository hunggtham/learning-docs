name: Temporary CSS SCSS Tailwind canonical audit

on:
  push:
    paths:
      - '.github/workflows/tmp-css-scss-tailwind-canonical-audit.yml'
      - '.github/scripts/tmp_css_scss_tailwind_audit.py'

permissions:
  contents: write

jobs:
  audit-frontend-styles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit canonical style notes
        run: python .github/scripts/tmp_css_scss_tailwind_audit.py
      - name: Commit canonical audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-css-scss-tailwind-canonical-audit.yml
          rm -f .github/scripts/tmp_css_scss_tailwind_audit.py
          git add 10_frontend/css 10_frontend/scss 10_frontend/tailwind .github/workflows/tmp-css-scss-tailwind-canonical-audit.yml .github/scripts/tmp_css_scss_tailwind_audit.py
          git diff --cached --stat
          git commit -m 'Deepen canonical CSS SCSS Tailwind learning notes'
          git push origin HEAD:main
