<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Study Shelf" />
    <meta name="application-name" content="Study Shelf" />
    <meta name="description" content="Personal learning library with search, reading progress, bookmarks, review queue, offline reading and knowledge links." />
    <title>Study Shelf</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./learning-os.css" />
    <link rel="stylesheet" href="./progress-sync.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      .doc-card h3 { margin-bottom: 8px; }
      .doc-language { margin: 0 0 8px; color: var(--muted); font-size: .75rem; }
      .publish-note { margin: 18px 0 0; color: var(--muted); font-size: .84rem; }
      .folder-tree { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 4px; }
      .folder-button { min-height: 42px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); cursor: pointer; text-align: left; }
      .folder-button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
      .folder-button.navigation { color: var(--accent); }
      .folder-count { color: var(--muted); font-size: .75rem; }
      .folder-summary { align-self: center; color: var(--muted); font-size: .8rem; }
      @media (max-width: 760px) { .doc-language { font-size: .7rem; } }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Study Shelf home"><span>✦</span> Study Shelf</a>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme">◐</button>
      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <template id="home-template">
      <section class="hero">
        <p class="eyebrow">PERSONAL KNOWLEDGE LIBRARY</p>
        <h1>공부 자료를<br /><em>한곳에서, 편하게.</em></h1>
        <p class="hero-copy">Markdown 노트와 PDF 자료를 빠르게 찾아 읽을 수 있는 개인 학습 서재입니다.</p>
        <p class="publish-note">Chỉ các tài liệu đã được chủ sở hữu xác nhận quyền xuất bản mới xuất hiện ở đây.</p>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="제목 또는 경로로 검색…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>
      </section>
      <section class="library-section">
        <div class="library-heading">
          <div><p class="eyebrow">LIBRARY</p><h2 id="result-title">모든 자료</h2></div>
          <p id="result-count" class="muted"></p>
        </div>
        <div id="folder-tree" class="folder-tree" aria-label="Folder browser"></div>
        <div id="format-filters" class="filters" aria-label="File type filters"></div>
        <div id="filters" class="filters" aria-label="Document category filters"></div>
        <div id="document-grid" class="document-grid"></div>
      </section>
    </template>

    <script src="./supabase-config.js"></script>
    <script src="./progress-sync.js"></script>
    <script src="./app.js"></script>
    <script src="./learning-os.js"></script>
  </body>
</html>
