<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Study Shelf" />
    <meta name="application-name" content="Study Shelf" />
    <meta name="description" content="Personal learning library with search, read-later queue, read-aloud mode, reading progress, bookmarks and offline reading." />
    <title>Study Shelf</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./learning-os.css" />
    <link rel="stylesheet" href="./progress-sync.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      .doc-card h3 { margin-bottom: 8px; }
      .doc-language { margin: 0 0 8px; color: var(--muted); font-size: .75rem; }
      .publish-note { margin: 18px 0 0; color: var(--muted); font-size: .84rem; }

      .library-browser {
        display: grid;
        grid-template-columns: minmax(240px, 280px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
        margin-top: 24px;
      }
      .folder-sidebar {
        position: sticky;
        top: 88px;
        max-height: calc(100dvh - 112px);
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        scrollbar-width: thin;
      }
      .folder-sidebar-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 7px 10px;
        color: var(--muted);
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .folder-tree { display: grid; gap: 2px; }
      .folder-tree-row {
        --depth: 0;
        position: relative;
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        align-items: center;
        margin-left: calc(var(--depth) * 15px);
      }
      .folder-tree-row:not([data-depth="0"])::before {
        content: "";
        position: absolute;
        top: -3px;
        bottom: -3px;
        left: -8px;
        width: 1px;
        background: color-mix(in srgb, var(--line) 82%, transparent);
      }
      .folder-tree-row.trail:not(.active)::before { background: color-mix(in srgb, var(--accent) 42%, var(--line)); }
      .folder-toggle,
      .folder-toggle-spacer {
        width: 24px;
        height: 34px;
      }
      .folder-toggle {
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        border-radius: 7px;
      }
      .folder-toggle:hover,
      .folder-toggle:focus-visible { background: var(--accent-soft); color: var(--accent); outline: 0; }
      .folder-node {
        min-width: 0;
        min-height: 38px;
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }
      .folder-node:hover,
      .folder-node:focus-visible { background: color-mix(in srgb, var(--accent-soft) 52%, transparent); color: var(--ink); outline: 0; }
      .folder-tree-row.active .folder-node { background: var(--accent-soft); color: var(--accent); font-weight: 750; }
      .folder-tree-row.trail .folder-node { color: var(--ink); }
      .folder-node-icon { font-size: .95rem; line-height: 1; }
      .folder-node-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .folder-count {
        min-width: 24px;
        padding: 1px 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--line) 60%, transparent);
        color: var(--muted);
        font-size: .67rem;
        font-weight: 700;
        text-align: center;
      }
      .folder-tree-row.active .folder-count { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }

      .folder-content { min-width: 0; }
      .folder-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
      }
      .folder-breadcrumb {
        min-width: 0;
        min-height: 42px;
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        margin: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: color-mix(in srgb, var(--panel) 76%, transparent);
      }
      .compact-format-filter {
        min-height: 34px;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 5px 3px 8px;
        border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
        border-radius: 9px;
        background: color-mix(in srgb, var(--panel) 52%, transparent);
        color: var(--muted);
        opacity: .72;
        transition: opacity .14s, border-color .14s;
      }
      .compact-format-filter:hover,
      .compact-format-filter:focus-within { opacity: 1; border-color: var(--line); }
      .format-filter-icon { font-size: .72rem; line-height: 1; }
      .compact-format-filter select {
        max-width: 106px;
        padding: 2px 2px;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: .7rem;
        cursor: pointer;
      }
      .breadcrumb-button {
        min-height: 28px;
        max-width: min(260px, 55vw);
        padding: 3px 7px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .breadcrumb-button:hover,
      .breadcrumb-button:focus-visible,
      .breadcrumb-button.current { background: var(--accent-soft); color: var(--accent); outline: 0; }
      .breadcrumb-separator { color: var(--muted); opacity: .55; }

      .folder-children {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }
      .folder-card {
        min-width: 0;
        min-height: 72px;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 12px 13px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        transition: transform .14s, border-color .14s, box-shadow .14s;
      }
      .folder-card:hover,
      .folder-card:focus-visible { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 52%, var(--line)); box-shadow: 0 8px 20px #2221; outline: 0; }
      .folder-card-icon { font-size: 1.15rem; }
      .folder-card-copy { min-width: 0; }
      .folder-card-name { display: block; overflow: hidden; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
      .folder-card-meta { display: block; margin-top: 2px; color: var(--muted); font-size: .7rem; }
      .folder-card-arrow { color: var(--muted); font-size: 1.1rem; }
      .folder-empty-note { margin: 4px 0 18px; color: var(--muted); font-size: .8rem; }

      @media (max-width: 960px) {
        .library-browser { grid-template-columns: 220px minmax(0, 1fr); gap: 16px; }
        .folder-children { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 760px) {
        .doc-language { font-size: .7rem; }
        .library-browser { display: block; }
        .folder-sidebar { position: static; max-height: 330px; margin-bottom: 16px; }
        .folder-children { grid-template-columns: 1fr; }
        .folder-tree-row { margin-left: calc(var(--depth) * 13px); }
        .folder-toolbar { align-items: flex-start; }
        .compact-format-filter { margin-top: 4px; }
        .compact-format-filter select { max-width: 86px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Study Shelf home"><span>✦</span> Study Shelf</a>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme">◐</button>
      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <template id="home-template">
      <section class="hero">
        <p class="eyebrow">PERSONAL KNOWLEDGE LIBRARY</p>
        <h1>공부 자료를<br /><em>한곳에서, 편하게.</em></h1>
        <p class="hero-copy">Markdown 노트와 PDF 자료를 빠르게 찾아 읽을 수 있는 개인 학습 서재입니다.</p>
        <p class="publish-note">Chỉ các tài liệu đã được chủ sở hữu xác nhận quyền xuất bản mới xuất hiện ở đây.</p>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="제목 또는 경로로 검색…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>
      </section>
      <section class="library-section">
        <div class="library-heading">
          <div><p class="eyebrow">LIBRARY</p><h2 id="result-title">모든 자료</h2></div>
          <p id="result-count" class="muted"></p>
        </div>
        <div class="library-browser">
          <aside class="folder-sidebar" aria-label="Folder navigation">
            <div class="folder-sidebar-heading"><span>Folders</span><span>Depth</span></div>
            <nav id="folder-tree" class="folder-tree" aria-label="Folder browser"></nav>
          </aside>
          <section class="folder-content" aria-label="Folder contents">
            <div class="folder-toolbar">
              <nav id="folder-breadcrumb" class="folder-breadcrumb" aria-label="Folder path"></nav>
              <label class="compact-format-filter" title="Lọc theo định dạng file">
                <span class="format-filter-icon" aria-hidden="true">▤</span>
                <select id="format-filter" aria-label="Lọc theo định dạng file">
                  <option value="all">All</option>
                </select>
              </label>
            </div>
            <div id="folder-children" class="folder-children"></div>
            <div id="document-grid" class="document-grid"></div>
          </section>
        </div>
      </section>
    </template>

    <script src="./supabase-config.js"></script>
    <script src="./progress-sync.js"></script>
    <script src="./study-planner-auth.js"></script>
    <script src="./app.js"></script>
    <script src="./learning-os.js"></script>
    <script>
      (() => {
        let selectedFormat = 'all';
        let libraryDocuments = [];
        let applying = false;

        const typeGroup = type => {
          const value = String(type || '').toUpperCase();
          if (value === 'MD' || value === 'MARKDOWN') return 'MD';
          if (value === 'PDF') return 'PDF';
          if (['DOC', 'DOCX', 'ODT', 'RTF'].includes(value)) return 'DOCS';
          return value;
        };
        const typeLabel = type => ({ MD: 'Markdown', PDF: 'PDF', DOCS: 'Docs' }[type] || type);

        async function loadFormatOptions() {
          if (libraryDocuments.length) return libraryDocuments;
          try {
            const response = await fetch('./library/library.json');
            if (!response.ok) return [];
            libraryDocuments = (await response.json()).documents || [];
          } catch {
            libraryDocuments = [];
          }
          return libraryDocuments;
        }

        async function enhanceFormatFilter() {
          const select = document.querySelector('#format-filter');
          if (!select || select.dataset.ready === 'true') return;
          const documents = await loadFormatOptions();
          const groups = [...new Set(documents.map(doc => typeGroup(doc.type)).filter(Boolean))];
          const preferred = ['MD', 'PDF', 'DOCS'];
          groups.sort((a, b) => {
            const ai = preferred.indexOf(a);
            const bi = preferred.indexOf(b);
            if (ai >= 0 || bi >= 0) return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
            return a.localeCompare(b);
          });
          select.innerHTML = '<option value="all">All</option>' + groups.map(group => `<option value="${group}">${typeLabel(group)}</option>`).join('');
          if (![...select.options].some(option => option.value === selectedFormat)) selectedFormat = 'all';
          select.value = selectedFormat;
          select.dataset.ready = 'true';
          select.addEventListener('change', () => {
            selectedFormat = select.value;
            applyFormatFilter();
          });
          applyFormatFilter();
        }

        function applyFormatFilter() {
          if (applying) return;
          const grid = document.querySelector('#document-grid');
          if (!grid) return;
          applying = true;
          const cards = [...grid.querySelectorAll('.doc-card')];
          let visible = 0;
          for (const card of cards) {
            const type = typeGroup(card.querySelector('.type-badge')?.textContent);
            const show = selectedFormat === 'all' || type === selectedFormat;
            const shell = card.closest('.doc-card-shell') || card;
            shell.hidden = !show;
            if (show) visible += 1;
          }

          const count = document.querySelector('#result-count');
          if (count) {
            const folderCount = document.querySelectorAll('#folder-children .folder-card').length;
            const searching = Boolean(document.querySelector('#search')?.value.trim());
            count.textContent = searching ? `${visible} kết quả` : `${visible} file · ${folderCount} folder`;
          }
          applying = false;
        }

        let queued = false;
        const refresh = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            enhanceFormatFilter();
            applyFormatFilter();
          });
        };

        const observer = new MutationObserver(refresh);
        const appRoot = document.querySelector('#app');
        if (appRoot) observer.observe(appRoot, { childList: true, subtree: true });
        window.addEventListener('hashchange', refresh);
        refresh();
      })();
    </script>
  </body>
</html>
