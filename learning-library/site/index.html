<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Study Shelf" />
    <meta name="application-name" content="Study Shelf" />
    <meta name="description" content="Personal learning library with search, read-later queue, read-aloud mode, reading progress, bookmarks and offline reading." />
    <title>Study Shelf</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./learning-os.css" />
    <link rel="stylesheet" href="./progress-sync.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      .doc-card h3 { margin-bottom: 8px; }
      .doc-language { margin: 0 0 8px; color: var(--muted); font-size: .75rem; }
      .publish-note { margin: 18px 0 0; color: var(--muted); font-size: .84rem; }

      /*
       * Folder explorer
       *
       * The previous indented tree duplicated the same information already shown
       * by the folder cards and became difficult to scan as the library grew.
       * Keep the runtime tree in the DOM for app.js, but make the visible browser
       * a simple path bar + folder grid. Depth is represented by the breadcrumb.
       */
      .library-browser { margin-top: 24px; }
      .folder-sidebar { display: none; }
      .folder-content { min-width: 0; }

      .folder-toolbar {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 18px;
      }
      .folder-breadcrumb {
        min-width: 0;
        min-height: 46px;
        flex: 1;
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 2px;
        overflow-x: auto;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--panel) 82%, transparent);
        box-shadow: inset 0 1px 0 color-mix(in srgb, white 5%, transparent);
        scrollbar-width: none;
      }
      .folder-breadcrumb::-webkit-scrollbar { display: none; }
      .breadcrumb-button {
        min-height: 32px;
        max-width: min(260px, 42vw);
        flex: 0 0 auto;
        padding: 5px 9px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: .8rem;
        font-weight: 650;
        transition: background .14s, color .14s;
      }
      .breadcrumb-button:hover,
      .breadcrumb-button:focus-visible { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); color: var(--ink); outline: 0; }
      .breadcrumb-button.current { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
      .breadcrumb-separator {
        flex: 0 0 auto;
        color: var(--muted);
        opacity: .38;
        font-size: .9rem;
      }

      .compact-format-filter {
        min-height: 34px;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 5px 3px 8px;
        border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
        border-radius: 9px;
        background: color-mix(in srgb, var(--panel) 52%, transparent);
        color: var(--muted);
        opacity: .68;
        transition: opacity .14s, border-color .14s;
      }
      .compact-format-filter:hover,
      .compact-format-filter:focus-within { opacity: 1; border-color: var(--line); }
      .format-filter-icon { font-size: .72rem; line-height: 1; }
      .compact-format-filter select {
        max-width: 106px;
        padding: 2px;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: .7rem;
        cursor: pointer;
      }

      .folder-children {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
        margin: 2px 0 26px;
      }
      .folder-children:empty { display: none; }
      .folder-card {
        min-width: 0;
        min-height: 88px;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 20px;
        align-items: center;
        gap: 11px;
        padding: 14px 13px;
        border: 1px solid color-mix(in srgb, var(--line) 92%, transparent);
        border-radius: 13px;
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        box-shadow: 0 1px 0 color-mix(in srgb, white 4%, transparent);
        transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
      }
      .folder-card:hover,
      .folder-card:focus-visible {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
        background: color-mix(in srgb, var(--accent-soft) 26%, var(--panel));
        box-shadow: 0 10px 24px #2221;
        outline: 0;
      }
      .folder-card-icon {
        position: relative;
        width: 36px;
        height: 28px;
        display: block;
        border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
        border-radius: 5px 6px 7px 7px;
        background: color-mix(in srgb, var(--accent-soft) 58%, var(--panel));
        color: transparent;
        font-size: 0;
        box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .folder-card-icon::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 2px;
        width: 16px;
        height: 8px;
        border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
        background: color-mix(in srgb, var(--accent-soft) 58%, var(--panel));
      }
      .folder-card-copy { min-width: 0; }
      .folder-card-name {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: .92rem;
        font-weight: 760;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .folder-card-meta {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        color: var(--muted);
        font-size: .68rem;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .folder-card-arrow {
        color: var(--muted);
        font-size: 1.05rem;
        opacity: .36;
        transition: transform .14s ease, color .14s ease, opacity .14s ease;
      }
      .folder-card:hover .folder-card-arrow,
      .folder-card:focus-visible .folder-card-arrow { transform: translateX(2px); color: var(--accent); opacity: 1; }

      @media (max-width: 1080px) {
        .folder-children { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (max-width: 820px) {
        .folder-children { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 560px) {
        .doc-language { font-size: .7rem; }
        .folder-toolbar { align-items: center; gap: 6px; }
        .folder-breadcrumb { min-height: 42px; padding: 4px 6px; }
        .breadcrumb-button { min-height: 30px; max-width: 52vw; padding: 4px 7px; font-size: .75rem; }
        .compact-format-filter { min-height: 32px; padding-left: 6px; }
        .compact-format-filter select { max-width: 72px; }
        .folder-children { grid-template-columns: 1fr; gap: 8px; }
        .folder-card { min-height: 76px; padding: 11px 12px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Study Shelf home"><span>✦</span> Study Shelf</a>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme">◐</button>
      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <template id="home-template">
      <section class="hero">
        <p class="eyebrow">PERSONAL KNOWLEDGE LIBRARY</p>
        <h1>공부 자료를<br /><em>한곳에서, 편하게.</em></h1>
        <p class="hero-copy">Markdown 노트와 PDF 자료를 빠르게 찾아 읽을 수 있는 개인 학습 서재입니다.</p>
        <p class="publish-note">Chỉ các tài liệu đã được chủ sở hữu xác nhận quyền xuất bản mới xuất hiện ở đây.</p>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="제목 또는 경로로 검색…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>
      </section>
      <section class="library-section">
        <div class="library-heading">
          <div><p class="eyebrow">LIBRARY</p><h2 id="result-title">모든 자료</h2></div>
          <p id="result-count" class="muted"></p>
        </div>
        <div class="library-browser">
          <aside class="folder-sidebar" aria-hidden="true">
            <nav id="folder-tree" class="folder-tree" aria-label="Folder browser"></nav>
          </aside>
          <section class="folder-content" aria-label="Folder contents">
            <div class="folder-toolbar">
              <nav id="folder-breadcrumb" class="folder-breadcrumb" aria-label="Folder path"></nav>
              <label class="compact-format-filter" title="Lọc theo định dạng file">
                <span class="format-filter-icon" aria-hidden="true">▤</span>
                <select id="format-filter" aria-label="Lọc theo định dạng file">
                  <option value="all">All</option>
                </select>
              </label>
            </div>
            <div id="folder-children" class="folder-children"></div>
            <div id="document-grid" class="document-grid"></div>
          </section>
        </div>
      </section>
    </template>

    <script src="./supabase-config.js"></script>
    <script src="./progress-sync.js"></script>
    <script src="./study-planner-auth.js"></script>
    <script src="./app.js"></script>
    <script src="./learning-os.js"></script>
    <script>
      (() => {
        let selectedFormat = 'all';
        let libraryDocuments = [];
        let applying = false;

        const typeGroup = type => {
          const value = String(type || '').toUpperCase();
          if (value === 'MD' || value === 'MARKDOWN') return 'MD';
          if (value === 'PDF') return 'PDF';
          if (['DOC', 'DOCX', 'ODT', 'RTF'].includes(value)) return 'DOCS';
          return value;
        };
        const typeLabel = type => ({ MD: 'Markdown', PDF: 'PDF', DOCS: 'Docs' }[type] || type);

        async function loadFormatOptions() {
          if (libraryDocuments.length) return libraryDocuments;
          try {
            const response = await fetch('./library/library.json');
            if (!response.ok) return [];
            libraryDocuments = (await response.json()).documents || [];
          } catch {
            libraryDocuments = [];
          }
          return libraryDocuments;
        }

        async function enhanceFormatFilter() {
          const select = document.querySelector('#format-filter');
          if (!select || select.dataset.ready === 'true') return;
          const documents = await loadFormatOptions();
          const groups = [...new Set(documents.map(doc => typeGroup(doc.type)).filter(Boolean))];
          const preferred = ['MD', 'PDF', 'DOCS'];
          groups.sort((a, b) => {
            const ai = preferred.indexOf(a);
            const bi = preferred.indexOf(b);
            if (ai >= 0 || bi >= 0) return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
            return a.localeCompare(b);
          });
          select.innerHTML = '<option value="all">All</option>' + groups.map(group => `<option value="${group}">${typeLabel(group)}</option>`).join('');
          if (![...select.options].some(option => option.value === selectedFormat)) selectedFormat = 'all';
          select.value = selectedFormat;
          select.dataset.ready = 'true';
          select.addEventListener('change', () => {
            selectedFormat = select.value;
            applyFormatFilter();
          });
          applyFormatFilter();
        }

        function applyFormatFilter() {
          if (applying) return;
          const grid = document.querySelector('#document-grid');
          if (!grid) return;
          applying = true;
          const cards = [...grid.querySelectorAll('.doc-card')];
          let visible = 0;
          for (const card of cards) {
            const type = typeGroup(card.querySelector('.type-badge')?.textContent);
            const show = selectedFormat === 'all' || type === selectedFormat;
            const shell = card.closest('.doc-card-shell') || card;
            shell.hidden = !show;
            if (show) visible += 1;
          }

          const count = document.querySelector('#result-count');
          if (count) {
            const folderCount = document.querySelectorAll('#folder-children .folder-card').length;
            const searching = Boolean(document.querySelector('#search')?.value.trim());
            count.textContent = searching ? `${visible} kết quả` : `${visible} file · ${folderCount} folder`;
          }
          applying = false;
        }

        let queued = false;
        const refresh = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            enhanceFormatFilter();
            applyFormatFilter();
          });
        };

        const observer = new MutationObserver(refresh);
        const appRoot = document.querySelector('#app');
        if (appRoot) observer.observe(appRoot, { childList: true, subtree: true });
        window.addEventListener('hashchange', refresh);
        refresh();
      })();
    </script>
  </body>
</html>
